name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Apply the cheat patch
        run: |
          git apply --check galar-native-cheats.patch && git apply galar-native-cheats.patch || git apply --3way galar-native-cheats.patch
      - name: Cheat engine unit test
        run: cd dm/host && gcc -O1 -Wall -o /tmp/t_cheat tests/t_cheat.c cheat_vm.c && /tmp/t_cheat
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y git curl python3-venv build-essential cmake ninja-build
      - name: Build the APK
        run: WORK=/home/runner/psa-build bash scripts/build_apk_pc.sh
      - uses: actions/upload-artifact@v4
        with:
          name: PokemonShield-apk
          path: /home/runner/psa-build/*.apk
